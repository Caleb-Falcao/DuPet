{% extends 'global/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-duverde mb-4">➕ Nova Consulta para {{ pet.nome }}</h1>

  <form method="POST" class="bg-white shadow-md rounded-lg p-6 space-y-4">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="flex justify-end">
      <button type="submit" class="bg-duverde text-white px-4 py-2 rounded-md shadow hover:bg-green-700">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
