{% extends 'global/base.html' %}

{% block title %}Configurações - DuPet{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-duverde mb-6">⚙️ Configurações da Conta</h1>

  <!-- Mensagens de sucesso/erro -->
  {% if messages %}
    <div class="mb-4">
      {% for message in messages %}
        <div class="p-3 rounded-lg text-sm 
                    {% if message.tags == 'success' %} bg-green-100 text-green-700 
                    {% elif message.tags == 'error' %} bg-red-100 text-red-700 
                    {% else %} bg-slate-100 text-slate-700 {% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST" class="bg-white shadow-md rounded-xl p-6 space-y-4">
    {% csrf_token %}

    <!-- Nome de usuário -->
    <div>
      <label class="block text-sm font-medium text-slate-600">Nome de Usuário</label>
      <input type="text" name="username" value="{{ user.username }}" 
             class="mt-1 w-full border border-slate-200 rounded-lg p-2 focus:ring-green-600 focus:border-green-600">
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-600">Email</label>
      <input type="email" name="email" value="{{ user.email }}" 
             class="mt-1 w-full border border-slate-200 rounded-lg p-2 focus:ring-green-600 focus:border-green-600">
    </div>

    <!-- Nova senha -->
    <div>
      <label class="block text-sm font-medium text-slate-600">Nova Senha</label>
      <input type="password" name="password" placeholder="Deixe em branco se não quiser mudar"
             class="mt-1 w-full border border-slate-200 rounded-lg p-2 focus:ring-green-600 focus:border-green-600">
    </div>

    <!-- Botão salvar -->
    <div class="flex justify-end">
      <button type="submit" 
              class="bg-duverde text-white px-6 py-2 rounded-lg shadow hover:bg-green-700 transition">
        💾 Salvar Alterações
      </button>
    </div>
  </form>
</div>
{% endblock %}
