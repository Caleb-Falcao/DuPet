<!DOCTYPE html>
<html lang="pt-br">
{% load static %}
<head>
  <meta charset="UTF-8">
  <title>{% block title %}DuPet{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            duverde: '#16A34A',   // Verde principal
            duazul: '#E0F2F1',    // Terceira cor suave (verde-água)
            dufundo: '#F1F5F9'    // Fundo geral
          }
        }
      }
    }
  </script>

  <!-- Ícone -->
  <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>
<body class="bg-dufundo text-gray-800 min-h-screen flex flex-col">

  <!-- 🧭 NAVBAR -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-3xl font-extrabold text-duverde tracking-tight">DuPet</a>
      <nav class="space-x-6 text-sm font-medium">
        <a href="/" class="text-gray-700 hover:text-duverde transition-colors">Início</a>
        <a href="/pets/" class="text-gray-700 hover:text-duverde transition-colors">Pets</a>
        <a href="/clinics/" class="text-gray-700 hover:text-duverde transition-colors">Clínicas</a>
        {% if user.is_authenticated %}
          <span class="text-gray-600">Olá, <strong>{{ user.username }}</strong></span>
          <a href="{% url 'logout' %}" class="text-red-500 hover:text-red-600 transition-colors">Sair</a>
        {% else %}
          <a href="{% url 'login' %}" class="bg-duverde text-white px-3 py-1 rounded-lg hover:bg-green-700 transition-colors">Login</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <!-- 📄 CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- 📦 RODAPÉ -->
  <footer class="bg-white border-t py-6 text-center text-sm text-gray-500">
    &copy; {{ now|date:"Y" }} DuPet. Feito com <span class="text-red-500">❤</span> por Caleb Falcão.
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
