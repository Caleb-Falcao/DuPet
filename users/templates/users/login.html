<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="description" content="Página de login para acessar o sistema DuPet.">
    <meta name="keywords" content="login, pets, dupet, autenticação, sistema de pets">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login - DuPet</title>
</head>
<body class="bg-slate-100 font-sans">
  <div class="flex h-screen">
    <!-- Lado esquerdo com imagem -->
    <div class="w-1/2 bg-green-50 flex items-center justify-center">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Pet Illustration" class="w-3/4 max-w-md">
    </div>

    <!-- Lado direito com formulário -->
    <div class="w-1/2 flex items-center justify-center bg-white">
      <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg border border-slate-200">

        <h1 class="text-2xl font-bold mb-2 text-gray-800">Falta pouco para cuidar do seu pet! 🐶</h1>
        <p class="mb-6 text-slate-600">Como deseja continuar?</p>

        <!-- Botões Sociais -->
        <div class="space-y-3 mb-6">
          <button class="w-full flex items-center justify-center bg-[#1877F2] text-white px-4 py-2 rounded-md hover:bg-[#145DBF] transition">
            <svg class="w-6 h-6 mr-2 fill-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M22 12a10 10 0 1 0-11.6 9.9v-7h-2v-3h2v-2.3c0-2 1.2-3.1 3-3.1 .9 0 1.8.1 1.8.1v2h-1c-1 0-1.3.6-1.3 1.2V12h2.3l-.4 3h-1.9v7A10 10 0 0 0 22 12z"/>
            </svg>
            Continuar com Facebook
          </button>

          <button class="w-full flex items-center justify-center border border-slate-300 px-4 py-2 rounded-md hover:bg-slate-100 transition">
            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5 mr-2">
            Continuar com Google
          </button>
        </div>

        <!-- Formulário tradicional -->
        <form method="post" class="space-y-4">
          {% csrf_token %}
          {% if messages %}
            {% for message in messages %}
              <div class="text-red-600 text-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <input type="text" name="username" placeholder="Usuário" required 
                 class="w-full border border-slate-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
          <input type="password" name="password" placeholder="Senha" required 
                 class="w-full border border-slate-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
          
          <button type="submit" 
                  class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">
            Entrar
          </button>
        </form>
        <p class="mt-4 text-sm text-center text-slate-600">
          Ainda não tem conta? 
          <a href="{% url 'signup' %}" class="text-green-600 hover:underline">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
