<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="description" content="Página de login para acessar o sistema DuPet.">
    <meta name="keywords" content="login, pets, dupet, autenticação, sistema de pets">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login - DuPet</title>
</head>
<body class="bg-pink-50 font-sans">
  <div class="flex h-screen">
    <!-- Lado esquerdo com imagem -->
    <div class="w-1/2 bg-pink-100 flex items-center justify-center">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Pet Illustration" class="w-3/4 max-w-md">
    </div>

    <!-- Lado direito com formulário -->
    <div class="w-1/2 flex items-center justify-center bg-white">
      <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">

        <h1 class="text-2xl font-bold mb-2 text-gray-800">Falta pouco para cuidar do seu pet! 🐶</h1>
        <p class="mb-6 text-gray-600">Como deseja continuar?</p>

        <!-- Botões Sociais (simulados) -->
        <div class="space-y-3 mb-6">
          <button class="w-full flex items-center justify-center bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
              <path d="M22 12.1c0-.6 0-1.1-.1-1.6H12v3h5.6c-.3 1.4-1.2 2.5-2.4 3.2v2.6h3.9c2.2-2 3.4-5 3.4-8.2z"/>
              <path d="M12 22c2.4 0 4.5-.8 6.1-2.2l-3-2.6c-.8.5-1.9.8-3.1.8-2.4 0-4.4-1.6-5.1-3.8H3.7v2.4C5.2 19.9 8.3 22 12 22z"/>
              <path d="M6.9 13.2c-.2-.6-.4-1.3-.4-2s.1-1.4.4-2V6.8H3.7C3.3 7.7 3 8.8 3 10s.3 2.3.7 3.2l3.2-.1z"/>
              <path d="M12 4.4c1.3 0 2.4.4 3.3 1.2l2.4-2.4C16.4 1.8 14.3 1 12 1 8.3 1 5.2 3.1 3.7 6l3.2 2.4C7.6 6 9.6 4.4 12 4.4z"/>
            </svg>
            Continuar com Facebook
          </button>

          <button class="w-full flex items-center justify-center border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition">
            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5 mr-2">
            Continuar com Google
          </button>
        </div>

        <!-- Formulário tradicional -->
        <form method="post" class="space-y-4">
          {% csrf_token %}
          {% if messages %}
            {% for message in messages %}
              <div class="text-red-600 text-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <input type="text" name="username" placeholder="Usuário" required class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400">
          <input type="password" name="password" placeholder="Senha" required class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400">
          <button type="submit" class="w-full bg-pink-500 text-white py-2 rounded-md hover:bg-pink-600 transition">Entrar</button>
        </form>

        <p class="mt-4 text-sm text-center">Ainda não tem conta? <a href="{% url 'signup' %}" class="text-pink-500 hover:underline">Cadastre-se</a></p>

      </div>
    </div>
  </div>
</body>
</html>
