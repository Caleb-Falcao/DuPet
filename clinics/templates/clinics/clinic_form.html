{% extends 'global/base.html' %}
{% block title %}Nova Clínica{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-md">
  <h2 class="text-2xl font-bold text-duverde mb-6">➕ Nova Clínica</h2>

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    <!-- Renderiza campo por campo para estilizar -->
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <div class="flex space-x-4 mt-6">
      <button type="submit"
        class="bg-duverde text-white px-4 py-2 rounded-lg shadow hover:bg-green-700 transition">
        Salvar
      </button>
      <a href="{% url 'clinics:clinic_list' %}"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
        Voltar
      </a>
    </div>
  </form>
</div>
{% endblock %}
