<!-- templates/clinics/clinic_list.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clínicas Veterinárias</title>
</head>
<body>
    <h1>Clínicas Próximas</h1>
    <ul>
        {% for clinic in clinics %}
            <li><strong>{{ clinic.nome }}</strong> - {{ clinic.endereco }}</li>
        {% empty %}
            <li>Nenhuma clínica encontrada.</li>
        {% endfor %}
    </ul>
</body>
</html>
